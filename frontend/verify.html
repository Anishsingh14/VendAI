<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Verified — VendAI</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: { primary: "#4F46E5", "primary-hover": "#4338CA" },
      fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
    }
  }
}
</script>
<style>
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  @keyframes check-in {
    0% { transform: scale(0); opacity: 0; }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); opacity: 1; }
  }
  .animate-check { animation: check-in 0.6s ease-out forwards; }
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animate-fade-up { animation: fade-up 0.5s ease-out 0.4s forwards; opacity: 0; }
</style>
</head>
<body class="bg-slate-50 font-sans antialiased min-h-screen flex items-center justify-center">

<div class="w-full max-w-md mx-auto p-6">
  <div class="bg-white border border-slate-200 rounded-2xl p-10 text-center shadow-sm">
    <!-- Logo -->
    <div class="flex items-center justify-center gap-2 mb-8">
      <span class="material-symbols-outlined text-primary text-2xl">bolt</span>
      <span class="text-xl font-bold text-slate-900 tracking-tight">VendAI</span>
    </div>

    <!-- Success Icon -->
    <div class="w-20 h-20 mx-auto rounded-full bg-emerald-100 border-2 border-emerald-200 flex items-center justify-center mb-6 animate-check">
      <span class="material-symbols-outlined text-emerald-600 text-4xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
    </div>

    <!-- Message -->
    <div class="animate-fade-up">
      <h1 class="text-2xl font-bold text-slate-900 mb-3">Email Verified!</h1>
      <p class="text-slate-500 text-sm leading-relaxed mb-8">
        Your email has been successfully verified. Your VendAI account is now active and ready to use.
      </p>

      <!-- CTA -->
      <a href="/" class="inline-flex items-center justify-center w-full bg-primary hover:bg-primary-hover text-white font-medium py-3.5 rounded-xl transition-colors text-sm shadow-sm gap-2">
        <span class="material-symbols-outlined text-[18px]">login</span>
        Go to Login
      </a>

      <p class="text-xs text-slate-400 mt-6">You can now sign in with your email and password.</p>
    </div>
  </div>

  <!-- Footer -->
  <p class="text-center text-xs text-slate-400 mt-6">&copy; 2026 VendAI &middot; Campus Vending Intelligence</p>
</div>

</body>
</html>
